<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>My Orders - S K Pharmacy</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
body{background:#f0f2f5;font-family:Arial;margin:0}
.header{background:#232f3e;color:#fff;padding:10px;display:flex;justify-content:space-between;}
.order-box{background:#fff;padding:15px;margin:15px;border-radius:8px;border:1px solid #ddd}
.order-box h4{margin:5px 0}
.status-bar{display:flex;justify-content:space-between;margin:15px 0}
.status-step{text-align:center;font-size:12px;color:gray}
.status-step.active{color:green;font-weight:bold}
.status-line{height:3px;background:gray;margin:5px 0}
.status-line.done{background:green}
.btn{padding:8px 15px;border:none;border-radius:4px;cursor:pointer;margin:5px}
.btn-cancel{background:red;color:#fff}
.btn-invoice{background:#ff9900}
</style>
</head>
<body>
<div class="header">
<h3>My Orders</h3>
<input id="searchMobile" placeholder="अपना 10 Digit Mobile डालो" style="padding:5px">
<button onclick="loadOrders()">Search</button>
</div>

<div id="orderList">पहले अपना मोबाइल नंबर डाल कर Search करो</div>

<script>
const firebaseConfig = {apiKey: "AIzaSyD2EoywecfBv8JUXnsmFS4A131in790XBW", databaseURL: "https://grnoida-store-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db = firebase.database();

// URL से mobile auto ले लेगा
let urlParams = new URLSearchParams(window.location.search);
let autoMobile = urlParams.get('mobile');
if(autoMobile){ document.getElementById('searchMobile').value = autoMobile; loadOrders(); }

function loadOrders(){
  let mobile = document.getElementById('searchMobile').value;
  if(mobile.length!=10){alert('सही 10 Digit Mobile डालो'); return;}
  
  db.ref('orders').orderByChild('mobile').equalTo(mobile).once('value').then((snapshot)=>{
    let html = '';
    if(!snapshot.exists()){ document.getElementById('orderList').innerHTML = 'कोई Order नहीं मिला'; return; }
    
    snapshot.forEach((child)=>{
      let o = child.val();
      let steps = ['Ordered','Shipped','Out for Delivery','Delivered'];
      let currentStep = steps.indexOf(o.status);
      
      html += `<div class="order-box">
        <h4>Order ID: ${o.orderId}</h4>
        <p><b>Product:</b> ${o.cart[0].name} x ${o.cart[0].qty}</p>
        <p><b>Total:</b> ₹${o.total} | <b>Payment:</b> ${o.payment}</p>
        <p><b>Address:</b> ${o.name}, ${o.address}, ${o.pin}</p>
        
        <div class="status-bar">
          ${steps.map((s,i)=>`<div class="status-step ${i<=currentStep?'active':''}">${s}</div>`).join('')}
        </div>
        <div class="status-line ${currentStep>=0?'done':''}"></div>
        
        ${o.status!='Delivered' && o.status!='Cancelled' ? `<button class="btn btn-cancel" onclick="cancelOrder('${o.orderId}')">Cancel Order</button>` : ''}
        <button class="btn btn-invoice" onclick="window.location='invoice.html?id=${o.orderId}'">Download Invoice</button>
      </div>`;
    });
    document.getElementById('orderList').innerHTML = html;
  });
}

function cancelOrder(orderId){
  let otp = prompt('Cancel करने के लिए OTP डालो जो WhatsApp पर आया था');
  db.ref('orders/'+orderId).once('value').then((snap)=>{
    if(snap.val().orderOTP == otp){
      db.ref('orders/'+orderId).update({status:'Cancelled'});
      alert('Order Cancel हो गया');
      loadOrders();
    }else{ alert('गलत OTP'); }
  });
}
</script>
</body>
</html>
