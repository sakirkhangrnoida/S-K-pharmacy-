<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>My Orders - S K Pharmacy</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;margin:0;background:#eaeded}
.header{background:#232f3e;color:#fff;padding:15px;text-align:center;font-size:18px;font-weight:bold}
.box{background:#fff;margin:15px;padding:15px;border-radius:8px;border:1px solid #ddd}
.box.cancelled{border:2px solid red;background:#ffe6e6}
.order-id{color:#007185;font-weight:bold}
.price{color:#B12704;font-size:18px;font-weight:bold}
.tracker{display:flex;justify-content:space-between;margin:20px 0;position:relative}
.tracker::before{content:'';position:absolute;top:6px;left:0;right:0;height:2px;background:#ccc;z-index:0}
.step{text-align:center;font-size:12px;flex:1;position:relative;z-index:1}
.dot{width:14px;height:14px;border-radius:50%;background:#ccc;margin:0 auto 5px;border:2px solid #fff}
.dot.active{background:#067d62}
.step.active{color:#067d62;font-weight:bold}
.btn{padding:10px 15px;border:none;border-radius:4px;cursor:pointer;margin:5px;font-weight:bold}
.btn-yellow{background:#FFD814}
.btn-cancel{background:#fff;border:1px solid red;color:red}
.otp-box{margin-top:10px;display:none;padding:10px;background:#f7f7f7;border-radius:5px}
.otp-box input{padding:8px;width:120px;margin-right:5px}
</style>
</head>
<body>

<div class="header">📦 My Orders - Live Tracking</div>
<div id="orders">Loading...</div>

<script>
const firebaseConfig = {apiKey: "AIzaSyD2EoywrcF8vJUXnsmF5PA3t3inW79UX8Y", databaseURL: "https://grnoida-store-default-rtdb.asia-southeast1.firebasedatabase.app"};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let currentOTP = '';

// हर 5 सेकंड में Auto Refresh होगा - Live Tracking
setInterval(loadOrders, 5000);
loadOrders();

function loadOrders(){
db.ref('orders').orderByChild('time').limitToLast(20).on('value', snap=>{
  let html = '';
  snap.forEach(child=>{
    let o = child.val();
    let productName = o.cart && o.cart[0]? o.cart[0].name : 'Product';

    // 1. Amazon जैसा 5 Step Tracker
    let statusSteps = ['Ordered','Packed','Shipped','Out for Delivery','Delivered'];
    let currentStep = statusSteps.indexOf(o.status);

    let tracker = '<div class="tracker">';
    statusSteps.forEach((s,i)=>{
      let activeClass = i<=currentStep? 'active' : '';
      tracker += `<div class="step ${activeClass}"><div class="dot ${activeClass}"></div>${s}</div>`;
    });
    tracker += '</div>';

    // 2. Cancel बटन सिर्फ Ordered/Packed में
    let cancelBtn = '';
    if(o.status == 'Ordered' || o.status == 'Packed'){
      cancelBtn = `<button class="btn btn-cancel" onclick="sendCancelOTP('${o.orderId}','${o.mobile}')">Cancel Order</button>
      <div class="otp-box" id="otp-${o.orderId}">
        <input type="text" id="input-${o.orderId}" placeholder="6 Digit OTP">
        <button class="btn btn-yellow" onclick="verifyCancelOTP('${o.orderId}')">Submit</button>
      </div>`;
    }

    let boxClass = o.status == 'Cancelled'? 'box cancelled' : 'box';

    html += `<div class="${boxClass}">
      <div class="order-id">Order ID: #${o.orderId}</div>
      <div><b>${productName}</b> x ${o.cart[0].qty}</div>
      <div class="price">₹${o.total}</div>
      <div style="font-size:12px">Ordered on: ${new Date(o.time).toLocaleDateString('hi-IN')}</div>

      ${o.status!= 'Cancelled'? tracker : '<p style="color:red; font-weight:bold; text-align:center">❌ Order Cancelled</p>'}

      <button class="btn btn-yellow" onclick="whatsapp('${o.orderId}')">Track on WhatsApp</button>
      ${cancelBtn}
    </div>`;
  });
  document.getElementById('orders').innerHTML = html || '<p style="text-align:center">कोई Order नहीं मिला</p>';
});
}

function sendCancelOTP(orderId, mobile){
  currentOTP = Math.floor(100000 + Math.random() * 900000);
  document.getElementById(`otp-${orderId}`).style.display = 'block';
  db.ref('orders/'+orderId).update({cancelOTP: currentOTP, cancelRequest: true});
  window.open(`https://wa.me/91${mobile}?text=S K Pharmacy Cancel OTP: ${currentOTP} for Order ${orderId}`);
  alert('OTP आपके नंबर पर भेज दिया गया है');
}

function verifyCancelOTP(orderId){
  let input = document.getElementById(`input-${orderId}`).value;
  db.ref('orders/'+orderId).once('value', snap=>{
    if(input == snap.val().cancelOTP){
      alert('OTP सही है। Admin Approve करेगा');
    } else {
      alert('गलत OTP। दोबारा कोशिश करें');
    }
  });
}

function whatsapp(id){ window.open(`https://wa.me/919258751739?text=Track Order: ${id}`) }
</script>
</body>
</html>
