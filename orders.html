<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>My Orders - S K Pharmacy</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0}
.header{background:#232f3e;color:#fff;padding:15px;text-align:center}
.order-card{background:#fff;margin:15px;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.order-id{font-weight:bold;color:#0066c0}
.status-bar{display:flex;justify-content:space-between;margin:20px 0;position:relative}
.status-bar::before{content:'';position:absolute;top:15px;left:0;right:0;height:3px;background:#ddd;z-index:0}
.step{position:relative;z-index:1;text-align:center;font-size:12px}
.step .circle{width:30px;height:30px;border-radius:50%;background:#ddd;margin:0 auto 5px;display:flex;align-items:center;justify-content:center}
.step.active .circle{background:#ff9900;color:#fff;font-weight:bold}
.step.done .circle{background:green;color:#fff}
</style>
</head>
<body>

<div class="header"><h2>📦 My Orders</h2></div>
<div id="ordersList">Loading...</div>

<script type="module" src="firebase.js"></script>
<script type="module">
import { db } from './firebase.js';
import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const ordersList = document.getElementById('ordersList');

// Firebase से सारे Order लाओ
onValue(ref(db, 'orders/'), (snapshot) => {
  const data = snapshot.val();
  if(!data){
    ordersList.innerHTML = '<p style="text-align:center;padding:50px">कोई Order नहीं है</p>';
    return;
  }
  
  let html = '';
  Object.values(data).reverse().forEach(order => {
    html += `
    <div class="order-card">
      <p><span class="order-id">Order ID: ${order.orderId}</span></p>
      <p><b>Total:</b> ₹${order.total} | <b>Payment:</b> ${order.payment}</p>
      <p><b>Address:</b> ${order.address}</p>
      
      ${getStatusBar(order.status)}
      
      <button onclick="window.location='order-details.html?id=${order.orderId}'" 
      style="padding:10px 20px;background:#ff9900;border:none;border-radius:4px;cursor:pointer">
      View Details</button>
    </div>`;
  });
  ordersList.innerHTML = html;
});

function getStatusBar(currentStatus){
  const steps = ['Ordered','Confirmed','Packed','Shipped','Out for Delivery','Delivered'];
  let currentIndex = steps.indexOf(currentStatus);
  if(currentIndex == -1) currentIndex = 0;
  
  let html = '<div class="status-bar">';
  steps.forEach((step, i) => {
    let cls = '';
    if(i < currentIndex) cls = 'done';
    if(i == currentIndex) cls = 'active';
    
    html += `<div class="step ${cls}">
      <div class="circle">${i < currentIndex ? '✓' : i+1}</div>
      <div>${step}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

</script>
</body>
</html>
