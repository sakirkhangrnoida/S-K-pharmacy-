<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel - GRNoida</title>
<style>
body{font-family:Arial;padding:10px;background:#f3f3f3}
h2{text-align:center}
.order{background:#fff;padding:15px;margin:10px 0;border-radius:8px;box-shadow:0 2px 5px #ccc}
.order.cancelled{border-left:5px solid red; background:#ffe6e6}
button{padding:10px 12px;margin:4px;border:0;border-radius:4px;cursor:pointer;color:#fff;font-weight:bold}
.packed{background:#ff9900}
.shipped{background:#007185}
.delivered{background:#067d62}
.cancelled-btn{background:red}
.approve-btn{background:green}
.reject-btn{background:orange}
.info{font-size:14px; margin:5px 0}
.status{font-weight:bold; color:green}
</style>
</head>
<body>
<h2>📦 GRNoida Admin Panel</h2>
<div id="orders">Loading Orders...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2EoywrcF8vJUXnsmF5PA3t3inW79UX8Y",
  databaseURL: "https://grnoida-store-default-rtdb.asia-southeast1.firebasedatabase.app",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ordersDiv = document.getElementById('orders');

onValue(ref(db, 'orders'), (snapshot) => {
  ordersDiv.innerHTML = '';
  const data = snapshot.val();
  if(!data){ ordersDiv.innerHTML = '<p style="text-align:center">No Orders Yet</p>'; return; }

  Object.values(data).sort((a,b)=> b.time - a.time).forEach(order => {
    let productName = order.cart && order.cart[0]? order.cart[0].name : 'Product';

    ordersDiv.innerHTML += `
    <div class="order ${order.status=='Cancelled'?'cancelled':''}">
      <div class="info"><b>Order ID:</b> #${order.orderId}</div>
      <div class="info"><b>Product:</b> ${productName} x ${order.cart[0].qty}</div>
      <div class="info"><b>Customer:</b> ${order.name} | ${order.mobile}</div>
      <div class="info"><b>Address:</b> ${order.address}, ${order.pin}</div>
      <div class="info"><b>Total:</b> ₹${order.total} | <b>Payment:</b> ${order.payment}</div>
      <div class="info"><b>Status:</b> <span class="status">${order.status}</span></div>

      ${order.cancelRequest? `
        <div style="background:#fff3cd;padding:10px;border-radius:5px;margin:10px 0">
          <p style="color:red;margin:0"><b>Cancel Requested!</b></p>
          <p style="margin:5px 0">OTP: <b>${order.cancelOTP}</b></p>
          <button class="approve-btn" onclick="approveCancel('${order.orderId}')">Approve Cancel</button>
          <button class="reject-btn" onclick="rejectCancel('${order.orderId}')">Reject</button>
        </div>
      `: ''}

      ${order.status!='Cancelled' && order.status!='Delivered'? `
      <hr>
      <button class="packed" onclick="updateStatus('${order.orderId}','Packed')">Packed</button>
      <button class="shipped" onclick="updateStatus('${order.orderId}','Shipped')">Shipped</button>
      <button class="delivered" onclick="updateStatus('${order.orderId}','Delivered')">Delivered</button>
      <button class="cancelled-btn" onclick="forceCancel('${order.orderId}')">Force Cancel</button>
      `: ''}
    </div>`;
  });
});

window.updateStatus = function(orderId, status) {
  update(ref(db, 'orders/' + orderId), { status: status });
  alert(`Status updated to ${status}`);
  window.open(`https://wa.me/919258751739?text=Order ${orderId} status: ${status}`);
}

window.forceCancel = function(orderId) {
  if(confirm('Order Force Cancel करना है?')){
    update(ref(db, 'orders/' + orderId), { status: 'Cancelled' });
    alert('Order Cancelled');
  }
}

window.approveCancel = function(orderId) {
  if(confirm('Cancel Approve करना है?')){
    update(ref(db, 'orders/' + orderId), { status: 'Cancelled', cancelRequest: false });
    alert('Order Cancelled');
  }
}

window.rejectCancel = function(orderId) {
  update(ref(db, 'orders/' + orderId), { cancelRequest: false, cancelOTP: '' });
  alert('Cancel Request Rejected');
}
</script>
</body>
</html>
