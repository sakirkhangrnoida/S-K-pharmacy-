<!DOCTYPE html>
<html lang="hi">
<head>
<title>Review लिखें - S K Pharmacy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f7f8f8;margin:0;padding:15px}
.box{max-width:700px;margin:30px auto;background:white;padding:25px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h2{color:#0F1111;margin-top:0;font-size:24px}
.stars{font-size:45px;cursor:pointer;margin:12px 0}
.stars span{color:#ddd;transition:0.2s;display:inline-block}
.stars span.active{color:#ffa41c}
input,textarea{width:100%;padding:12px;border:1px solid #a6a6a6;border-radius:4px;font-size:15px;margin:8px 0}
.btn{width:100%;padding:14px;background:#ffa41c;border:none;color:#0F1111;font-weight:bold;font-size:16px;border-radius:4px;cursor:pointer}
.btn:hover{background:#f0b04b}
.btn2{padding:8px 14px;background:#e7e9ec;border:1px solid #a6a6a6;border-radius:4px;cursor:pointer;margin:5px}
.btn-danger{background:#c7511f;color:white;border:none}
.msg{padding:14px;border-radius:6px;margin:15px 0;display:none;font-size:15px}
.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.topbar{background:#232f3e;padding:12px;text-align:center;margin:-15px -15px 25px -15px}
.topbar a{color:white;margin:0 12px;text-decoration:none;font-size:14px}
#preview img{width:80px;height:80px;object-fit:cover;margin:5px;border-radius:4px;border:1px solid #ddd}
.gali{color:red;font-size:13px;margin-top:-5px;display:none}
.helpful{color:#565959;font-size:13px;cursor:pointer}
.helpful:hover{color:#c7511f}
</style>
</head>
<body>

<div class="topbar">
<a href="index.html">Home</a>
<a href="skin-care.html">Skin Care</a>
<a href="contact.html">Contact</a>
</div>

<div class="box">
<h2 id="title">Review लिखें</h2>
<p style="color:#565959;font-size:14px;margin-top:-5px">प्रोडक्ट: <b id="pName"></b></p>

<div id="ok" class="msg success">✓ Review Submit हो गया। वापस जा रहे हैं...</div>
<div id="err" class="msg error"></div>

<form id="f">
<label style="font-weight:bold;color:#0F1111;margin-top:8px;display:block">Rating *</label>
<div class="stars" id="s"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
<input type="hidden" id="r" value="0">

<label style="font-weight:bold;color:#0F1111;margin-top:8px;display:block">नाम *</label>
<input type="text" id="n" placeholder="आपका नाम" required>

<label style="font-weight:bold;color:#0F1111;margin-top:8px;display:block">Review *</label>
<textarea id="rv" rows="5" placeholder="प्रोडक्ट कैसा लगा? ईमानदारी से बताएं" required></textarea>
<div class="gali" id="gali">गाली वाले शब्द यूज नहीं कर सकते भाई 🙏</div>

<label style="font-weight:bold;color:#0F1111;margin-top:8px;display:block">फोटो जोड़ें - Max 3</label>
<input type="file" id="photos" accept="image/*" multiple>
<div id="preview"></div>

<button class="btn" id="submitBtn">Submit Review</button>
</form>

<div id="editBox" style="display:none">
<button class="btn2" id="editBtn">Edit करें</button>
<button class="btn2 btn-danger" id="delBtn">Delete करें</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, get, remove, update, serverTimestamp, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const cfg = {
  apiKey: "AIzaSyBSvruP8VLxQmUCOhMToZry_LUGv17Oe6g",
  authDomain: "roopmantra-9942c.firebaseapp.com",
  databaseURL: "https://roopmantra-9942c-default-rtdb.firebaseio.com",
  projectId: "roopmantra-9942c",
  storageBucket: "roopmantra-9942c.firebasestorage.app",
  messagingSenderId: "8210530882",
  appId: "1:8210530882:web:4e75fd6df9669bf2561592"
};

const app = initializeApp(cfg);
const db = getDatabase(app);
const storage = getStorage(app);

// Gali filter list
const galiWords = ['mc','bc','bhenchod','madarchod','chutiya','gandu','randi','bhosdike','bkl','bsdk'];

const prod = decodeURIComponent(new URLSearchParams(location.search).get('product') || 'Product');
const userId = localStorage.getItem('userPhone') || 'guest_' + Math.random().toString(36).substr(2,9);
document.getElementById('pName').innerText = prod;

// Star rating
let rate = 0;
document.querySelectorAll('#s span').forEach((x,i)=>{
  x.onclick = ()=>{
    rate = i+1;
    document.getElementById('r').value = rate;
    document.querySelectorAll('#s span').forEach((y,j)=>y.classList.toggle('active', j<rate));
  };
});

// Photo preview
let photoFiles = [];
document.getElementById('photos').onchange = e=>{
  photoFiles = Array.from(e.target.files).slice(0,3);
  document.getElementById('preview').innerHTML = '';
  photoFiles.forEach(f=>{
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    document.getElementById('preview').appendChild(img);
  });
};

// Check if user already reviewed - 1 User 1 Review
let existingKey = null;
get(query(ref(db,'reviews'), orderByChild('userId_product'), equalTo(userId+'_'+prod))).then(snap=>{
  if(snap.exists()){
    const data = snap.val();
    existingKey = Object.keys(data)[0];
    const rev = data[existingKey];
    document.getElementById('title').innerText = 'Review Edit करें';
    document.getElementById('r').value = rev.rating;
    rate = rev.rating;
    document.querySelectorAll('#s span').forEach((y,j)=>y.classList.toggle('active', j<rate));
    document.getElementById('n').value = rev.name;
    document.getElementById('rv').value = rev.review;
    document.getElementById('submitBtn').innerText = 'Update Review';
    document.getElementById('editBox').style.display = 'block';
  }
});

// Gali filter check
document.getElementById('rv').oninput = e=>{
  const txt = e.target.value.toLowerCase();
  const hasGali = galiWords.some(w => txt.includes(w));
  document.getElementById('gali').style.display = hasGali? 'block' : 'none';
  document.getElementById('submitBtn').disabled = hasGali;
};

// Delete
document.getElementById('delBtn').onclick = ()=>{
  if(confirm('Review डिलीट करना है?')){
    remove(ref(db,'reviews/'+existingKey)).then(()=>{
      alert('Review डिलीट हो गया');
      history.back();
    });
  }
};

// Edit mode
document.getElementById('editBtn').onclick = ()=>{
  document.getElementById('f').style.display = 'block';
  document.getElementById('editBox').style.display = 'none';
};

// Submit
document.getElementById('f').onsubmit = async e=>{
  e.preventDefault();
  if(rate==0) return alert('Rating दो स्टार');
  if(document.getElementById('gali').style.display=='block') return alert('गाली हटाओ पहले');

  const name = document.getElementById('n').value.trim();
  const review = document.getElementById('rv').value.trim();

  if(review.length < 10) return alert('कम से कम 10 शब्द लिखो भाई');

  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').innerText = 'Upload हो रहा है...';

  // Upload photos
  let photoUrls = [];
  for(let i=0; i<photoFiles.length; i++){
    const file = photoFiles[i];
    const storageRef = sref(storage, `reviews/${Date.now()}_${i}_${file.name}`);
    const snap = await uploadBytes(storageRef, file);
    const url = await getDownloadURL(snap.ref);
    photoUrls.push(url);
  }

  const reviewData = {
    product: prod,
    rating: rate,
    name: name,
    review: review,
    photos: photoUrls,
    userId: userId,
    userId_product: userId+'_'+prod,
    date: serverTimestamp(),
    status: 'approved',
    helpful: 0
  };

  if(existingKey){
    await update(ref(db,'reviews/'+existingKey), reviewData);
  } else {
    await push(ref(db,'reviews'), reviewData);
  }

  document.getElementById('f').style.display='none';
  document.getElementById('ok').style.display='block';
  setTimeout(()=> history.back(), 2000);
};
</script>
</body>
</html>
