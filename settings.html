<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Settings - S K Pharmacy</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
body{background:#f0f2f5;font-family:Arial;margin:0}
.header{background:#232f3e;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
.container{max-width:600px;margin:20px auto;padding:20px}
.box{background:#fff;padding:20px;margin-bottom:15px;border-radius:8px;box-shadow:0 1px 3px #ccc}
.box h3{margin-top:0;border-bottom:1px solid #eee;padding-bottom:10px}
.box input{width:95%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:4px}
.btn{background:#ff9900;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;font-weight:bold;margin:5px}
.btn-danger{background:red;color:#fff}
.btn-logout{background:#232f3e;color:#fff;width:100%;padding:12px}
.menu a{display:block;padding:12px;border-bottom:1px solid #eee;text-decoration:none;color:#000}
.menu a:hover{background:#f5f5f5}
</style>
</head>
<body>
<div class="header">
<h3>⚙️ Account Settings</h3>
<a href="index.html" style="color:#fff;text-decoration:none">Home</a>
</div>

<div class="container">

<!-- PROFILE BOX -->
<div class="box">
<h3>मेरी जानकारी</h3>
<p><b>नाम:</b> <span id="uName">Guest</span></p>
<p><b>मोबाइल:</b> <span id="uMobile">-</span></p>
<button class="btn" onclick="editProfile()">Edit Profile</button>
</div>

<!-- CHANGE PASSWORD -->
<div class="box">
<h3>Password बदलें</h3>
<input id="oldPass" placeholder="पुराना Password" type="password">
<input id="newPass" placeholder="नया Password" type="password">
<button class="btn" onclick="changePass()">Update Password</button>
</div>

<!-- QUICK LINKS -->
<div class="box menu">
<h3>Quick Links</h3>
<a href="orders.html">📦 My Orders</a>
<a href="invoice.html">🧾 My Invoices</a>
<a href="dashboard.html">👨‍💼 Admin Panel</a>
<a href="contact.html">📞 Contact Us</a>
<a href="privacy.html">🔒 Privacy Policy</a>
</div>

<!-- LOGOUT -->
<div class="box">
<button class="btn-logout" onclick="logout()">Logout</button>
</div>

</div>

<script>
const firebaseConfig = {apiKey: "AIzaSyD2EoywecfBv8JUXnsmFS4A131in790XBW", databaseURL: "https://grnoida-store-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db = firebase.database();

let userMobile = localStorage.getItem('userMobile');
let userName = localStorage.getItem('userName');

// अगर Login नहीं है तो Login पर भेज दो
if(!userMobile){
  alert('पहले Login करें');
  window.location = 'login.html';
}

document.getElementById('uName').innerText = userName;
document.getElementById('uMobile').innerText = userMobile;

function editProfile(){
  let newName = prompt('नया नाम डालो:', userName);
  if(newName){
    db.ref('users/'+userMobile).update({name:newName});
    localStorage.setItem('userName', newName);
    document.getElementById('uName').innerText = newName;
    alert('Profile Update हो गई');
  }
}

function changePass(){
  let oldPass = document.getElementById('oldPass').value;
  let newPass = document.getElementById('newPass').value;
  
  db.ref('users/'+userMobile).once('value').then((snap)=>{
    if(snap.val().password == oldPass){
      db.ref('users/'+userMobile).update({password:newPass});
      alert('Password बदल गया');
      document.getElementById('oldPass').value = '';
      document.getElementById('newPass').value = '';
    }else{
      alert('पुराना Password गलत है');
    }
  });
}

function logout(){
  if(confirm('पक्का Logout करना है?')){
    localStorage.clear();
    alert('Logout हो गए');
    window.location = 'login.html';
  }
}
</script>
</body>
</html>
