<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Password भूल गए - S K Pharmacy</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">
  <h2>Password Reset करें</h2>
  <p style="font-size:14px;text-align:center">अपना Email डालें, Reset Link भेज देंगे</p>
  <input type="email" id="email" placeholder="Email डालें" required>
  <button id="resetBtn">Reset Link भेजें</button>
  <p id="msg" class="error"></p>
  <p><a href="login.html">Login पर वापस जाएं</a></p>
</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="forgot.js"></script>
</body>
</html>
