<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S K Pharmacy - Product</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f3f6}
.navbar{background:#2874f0;padding:12px;color:#fff;display:flex;justify-content:space-between}
.container{max-width:1200px;margin:20px auto;display:flex;gap:20px;flex-wrap:wrap;padding:0 10px}
.left{flex:1;min-width:320px}
.right{flex:1;min-width:320px}
.img-gallery{background:#fff;padding:20px;border-radius:4px;position:relative}
.img-gallery img{width:100%;max-height:400px;object-fit:contain}
.dots{position:absolute;top:15px;right:15px;cursor:pointer;padding:8px}
.btn-row{display:flex;gap:10px;margin-top:15px}
.btn{flex:1;padding:14px;border:none;border-radius:2px;font-size:16px;cursor:pointer;font-weight:500}
.btn-share{background:#2874f0;color:#fff}
.btn-save{background:#fff;color:#2874f0;border:1px solid #2874f0}
.details{background:#fff;padding:20px;border-radius:4px}
.price{font-size:30px;font-weight:bold;margin:10px 0}
.stock{color:#388e3c;margin:8px 0}
.buy-btn{width:100%;background:#fb641b;color:#fff;border:none;padding:16px;font-size:18px;font-weight:bold;border-radius:2px;cursor:pointer;margin-top:15px}
.footer{background:#172337;color:#fff;padding:30px;margin-top:40px;text-align:center}
.footer a{color:#fff;margin:0 12px;text-decoration:none;font-size:14px}
#otpPopup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;justify-content:center;align-items:center}
.popup-box{background:#fff;width:90%;max-width:420px;border-radius:8px;padding:25px;position:relative}
.popup-box input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:4px}
.popup-box button{width:100%;padding:12px;background:#2874f0;color:#fff;border:none;border-radius:4px;font-size:16px;margin-top:10px;cursor:pointer}
#otpBox{display:none}
#msg{display:none;margin-top:12px;padding:10px;border-radius:4px}
.msg-error{background:#ffebee;color:#c62828}
.msg-success{background:#e8f5e9;color:#2e7d32}
.close-btn{position:absolute;top:10px;right:15px;font-size:24px;cursor:pointer;border:none;background:none}
</style>
</head>
<body>

<div class="navbar">
  <div><b>S K Pharmacy</b></div>
  <div><a href="orders.html" style="color:#fff">My Orders</a></div>
</div>

<div class="container">
  <div class="left">
    <div class="img-gallery">
      <div class="dots" onclick="showMsg('Menu opened','success')"><i class="fas fa-ellipsis-v"></i></div>
      <img src="p31.jpg" alt="Product" id="prodImg">
      <div class="btn-row">
        <button class="btn btn-share" onclick="shareProduct()"><i class="fas fa-share-alt"></i> Share</button>
        <button class="btn btn-save" onclick="showMsg('Saved','success')"><i class="far fa-heart"></i> Save</button>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="details">
      <h2 id="prodName">Cadbury Bournvita 500g</h2>
      <div class="price">₹<span id="prodPrice">249</span></div>
      <div class="stock"><i class="fas fa-check-circle"></i> In stock</div>
      <input type="number" id="qty" value="1" min="1" style="padding:8px;margin:15px 0;width:80px">
      <button class="buy-btn" onclick="startOTP()">Buy Now</button>
    </div>
  </div>
</div>

<!-- OTP Popup - तेरी IDs -->
<div id="otpPopup">
  <div class="popup-box">
    <button class="close-btn" onclick="closePopup()">×</button>
    <h3>Confirm Order</h3>
    <p>Product: <b id="productName"></b></p>
    <p>Total: ₹<b id="productPrice"></b></p>
    <input type="tel" id="mobileInput" placeholder="10 Digit Mobile" maxlength="10">
    <button id="sendBtn" onclick="sendOTP()">Send OTP</button>
    <div id="otpBox">
      <input type="number" id="otpInput" placeholder="6 Digit OTP" maxlength="6">
      <button id="verifyBtn" onclick="verifyOTP()">Verify & Order</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<div class="footer">
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
  <a href="privacy.html">Privacy Policy</a>
  <a href="terms.html">Terms</a>
  <a href="refund.html">Refund</a>
  <p style="margin-top:15px">© 2026 S K Pharmacy</p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// ====== STEP 1: यहां अपनी Firebase Key डाल दे भाई ======
const firebaseConfig = {
  apiKey: "PASTE_YOUR_FIREBASE_API_KEY_HERE",
  authDomain: "grnoida-store.firebaseapp.com",
  databaseURL: "https://grnoida-store-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "grnoida-store",
  storageBucket: "grnoida-store.firebasestorage.app",
  messagingSenderId: "665639961400",
  appId: "1:665639961400:web:cb704b020b910fc6a77cd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ====== STEP 2: यहां Fast2SMS Key डाल दे ======
const FAST2SMS_API = "PASTE_YOUR_FAST2SMS_KEY_HERE";
const WHATSAPP_NUM = "919258751739";

let currentProduct = "", currentPrice = 0, currentQty = 1, currentMobile = "", currentOTP = "";

function startOTP(){
  currentQty = document.getElementById('qty').value;
  currentProduct = document.getElementById('prodName').innerText;
  currentPrice = 594 * currentQty;
  document.getElementById('productName').innerText = currentProduct;
  document.getElementById('productPrice').innerText = currentPrice;
  document.getElementById('otpPopup').style.display = 'flex';
  document.getElementById('msg').style.display = 'none';
  document.getElementById('otpBox').style.display = 'none';
}

function closePopup(){document.getElementById('otpPopup').style.display = 'none'}

function shareProduct(){
  navigator.share ? navigator.share({title:'S K Pharmacy',url:location.href}) : showMsg('Link copied','success');
}

async function sendOTP(){
  const mobile = document.getElementById('mobileInput').value;
  const msg = document.getElementById('msg');
  const sendBtn = document.getElementById('sendBtn');
  
  if(mobile.length != 10){showMsg("10 Digit Mobile डालो","error");return}
  
  sendBtn.disabled = true; sendBtn.innerText = "Sending...";
  currentMobile = mobile;
  currentOTP = Math.floor(100000 + Math.random() * 900000);
  
  await db.ref('otps/' + mobile).set({otp: currentOTP, time: Date.now()});
  await fetch(`https://www.fast2sms.com/dev/bulkV2?authorization=${FAST2SMS_API}&route=otp&variables_values=${currentOTP}&numbers=${mobile}`);
  
  document.getElementById('otpBox').style.display = 'block';
  sendBtn.innerText = 'OTP Sent ✓';
  showMsg('OTP भेज दिया, SMS चेक करो','success');
}

async function verifyOTP(){
  const inputOTP = document.getElementById('otpInput').value;
  const verifyBtn = document.getElementById('verifyBtn');
  
  if(inputOTP.length != 6){showMsg("6 Digit OTP डालो","error");return}
  
  verifyBtn.disabled = true; verifyBtn.innerText = "Verifying...";
  const snap = await db.ref('otps/' + currentMobile).once('value');
  
  if(!snap.exists() || Date.now() - snap.val().time > 120000){
    showMsg("OTP Expire हो गया","error");
    verifyBtn.disabled = false; verifyBtn.innerText = "Verify & Order";
    return;
  }
  
  if(inputOTP == snap.val().otp){
    await db.ref('otps/' + currentMobile).remove();
    const orderId = 'ORD' + Date.now();
    await db.ref('orders/' + orderId).set({
      orderId, product: currentProduct, price: 594, qty: currentQty,
      mobile: currentMobile, status: "Order Placed", total: currentPrice, time: Date.now()
    });
    showMsg("Order Confirm ✓ WhatsApp खुल रहा है","success");
    setTimeout(()=>{window.open(`https://wa.me/${WHATSAPP_NUM}?text=Order:${orderId}`,'_blank');closePopup()},1000);
  } else {
    showMsg("गलत OTP","error");
    verifyBtn.disabled = false; verifyBtn.innerText = "Verify & Order";
  }
}

function showMsg(text, type){
  let msg = document.getElementById('msg');
  msg.innerText = text;
  msg.className = type === 'error' ? 'msg-error' : 'msg-success';
  msg.style.display = 'block';
  setTimeout(()=>{msg.style.display='none'}, 3000);
}
</script>
</body>
</html>
