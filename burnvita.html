<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S K Pharmacy - Product</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;padding-bottom:100px}
.container{max-width:1200px;margin:auto;padding:20px;display:flex;gap:30px;flex-wrap:wrap}
.left{flex:1;min-width:300px}
.right{flex:1;min-width:300px}
.img-box{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 5px #ccc;text-align:center}
.img-box img{max-width:100%;height:auto}
.btns{display:flex;gap:10px;margin-top:15px}
.btn{flex:1;padding:12px;border:none;border-radius:4px;cursor:pointer;font-size:16px}
.btn-share{background:#2874f0;color:#fff}
.btn-save{background:#fff;border:1px solid #2874f0;color:#2874f0}
.price{font-size:28px;font-weight:bold;color:#212121}
.stock{color:green;margin:10px 0}
.buy-btn{width:100%;padding:15px;background:#fb641b;color:#fff;border:none;border-radius:4px;font-size:18px;cursor:pointer;margin-top:15px}
.footer{margin-top:50px;background:#212121;color:#fff;padding:20px;text-align:center}
.footer a{color:#fff;margin:0 10px;text-decoration:none}
#otpPopup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center}
.popup{background:#fff;padding:20px;border-radius:8px;width:90%;max-width:400px}
input{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:4px}
#msg{display:none;padding:10px;margin:10px 0;border-radius:4px}
.error{background:#ffebee;color:#c62828}
.success{background:#e8f5e9;color:#2e7d32}
.dots{position:absolute;top:10px;right:10px;cursor:pointer}
</style>
</head>
<body>

<div class="container">
  <div class="left">
    <div class="img-box">
      <div class="dots"><i class="fas fa-ellipsis-v"></i></div>
      <img src="product.jpg" alt="Product" id="prodImg">
      <div class="btns">
        <button class="btn btn-share" onclick="navigator.share({title:'S K Pharmacy',url:location.href})"><i class="fas fa-share-alt"></i> Share</button>
        <button class="btn btn-save"><i class="far fa-bookmark"></i> Save</button>
      </div>
    </div>
  </div>

  <div class="right">
    <h2 id="prodName">Cadbury Bournvita 500g</h2>
    <div class="price">₹<span id="prodPrice">594</span></div>
    <div class="stock">In stock</div>
    <p>* Check website for latest pricing. Images may be subject to copyright.</p>
    
    <label>Quantity:</label>
    <input type="number" id="qty" value="1" min="1">
    
    <button class="buy-btn" onclick="startOTP('Cadbury Bournvita 500g', 594, document.getElementById('qty').value)">Buy Now</button>
    
    <h3>Product Details</h3>
    <p>Tann Ki Shakti Mann Ki Shakti. ProHEALTH Vitamins D, B12, B9, B2.</p>
  </div>
</div>

<!-- OTP Popup - तेरे JS वाले IDs सेम हैं -->
<div id="otpPopup">
  <div class="popup">
    <h3>Order Confirm</h3>
    <p>Product: <span id="productName"></span></p>
    <p>Price: ₹<span id="productPrice"></span></p>
    <input type="tel" id="mobileInput" placeholder="10 Digit Mobile Number" maxlength="10">
    <button id="sendBtn" onclick="sendOTP()">OTP भेजो</button>
    <div id="otpBox" style="display:none">
      <input type="number" id="otpInput" placeholder="Enter 6 Digit OTP" maxlength="6">
      <button id="verifyBtn" onclick="verifyOTP()">Verify करो</button>
    </div>
    <p id="msg"></p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<div class="footer">
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
  <a href="privacy.html">Privacy</a>
  <a href="refund.html">Refund</a>
</div>

<!-- यहां अपना Firebase + otp-system.js वाला कोड पेस्ट कर दे -->
<script>
// तेरा Firebase + OTP वाला JS कोड यहीं पेस्ट होगा
</script>
</body>
</html>
