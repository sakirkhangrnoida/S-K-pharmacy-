<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Invoice - S K Pharmacy</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
body{background:#f0f2f5;font-family:Arial;padding:20px}
.invoice-box{max-width:800px;margin:auto;background:#fff;padding:30px;border:1px solid #ddd;border-radius:8px}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #232f3e;padding-bottom:10px}
.logo{font-size:24px;font-weight:bold;color:#232f3e}
.table{width:100%;border-collapse:collapse;margin:20px 0}
.table th, .table td{border:1px solid #ddd;padding:10px;text-align:left}
.table th{background:#232f3e;color:#fff}
.total-row{font-weight:bold;font-size:18px}
.btn-print{background:#ff9900;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin:5px;font-weight:bold}
.btn-whatsapp{background:green;color:#fff;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;margin:5px;font-weight:bold}
.footer{text-align:center;margin-top:30px;font-size:12px;color:gray}
@media print{.btn-print, .btn-whatsapp{display:none}}
</style>
</head>
<body>

<div id="invoiceData">Loading Invoice...</div>

<button class="btn-print" onclick="window.print()">🖨️ Print Invoice</button>
<button class="btn-whatsapp" id="whatsappBtn">📱 WhatsApp Bill</button>

<script>
const firebaseConfig = {apiKey: "AIzaSyD2EoywecfBv8JUXnsmFS4A131in790XBW", databaseURL: "https://grnoida-store-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db = firebase.database();

// URL से Order ID लेगा
let params = new URLSearchParams(window.location.search);
let orderId = params.get('id');

if(orderId){
  db.ref('orders/'+orderId).once('value').then((snapshot)=>{
    let o = snapshot.val();
    if(!o){ document.getElementById('invoiceData').innerHTML = 'Order नहीं मिला'; return; }
    
    let date = new Date(o.time).toLocaleDateString('hi-IN');
    
    let html = `
    <div class="invoice-box" id="printArea">
      <div class="header">
        <div>
          <div class="logo">S K Pharmacy</div>
          <p>Mathura, Uttar Pradesh<br>Mobile: 9258751739</p>
        </div>
        <div>
          <h2>TAX INVOICE</h2>
          <p><b>Order ID:</b> ${o.orderId}<br><b>Date:</b> ${date}</p>
        </div>
      </div>
      
      <h4>Bill To:</h4>
      <p><b>${o.name}</b><br>${o.address}<br>Pin: ${o.pin}<br>Mobile: ${o.mobile}</p>
      
      <table class="table">
        <tr><th>#</th><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>
        <tr>
          <td>1</td>
          <td>${o.cart[0].name}</td>
          <td>${o.cart[0].qty}</td>
          <td>₹${o.cart[0].price}</td>
          <td>₹${o.cart[0].price * o.cart[0].qty}</td>
        </tr>
        <tr class="total-row">
          <td colspan="4" style="text-align:right">Grand Total</td>
          <td>₹${o.total}</td>
        </tr>
      </table>
      
      <p><b>Payment Method:</b> ${o.payment}</p>
      <p><b>Status:</b> ${o.status}</p>
      
      <div class="footer">
        <p>Thank you for shopping with S K Pharmacy</p>
        <p>This is a computer generated invoice</p>
      </div>
    </div>
    `;
    document.getElementById('invoiceData').innerHTML = html;
    
    // WhatsApp Button
    let msg = encodeURIComponent(`S K Pharmacy Invoice\nOrder ID: ${o.orderId}\nProduct: ${o.cart[0].name}\nTotal: ₹${o.total}\nStatus: ${o.status}\nThank you!`);
    document.getElementById('whatsappBtn').onclick = ()=> window.open(`https://wa.me/91${o.mobile}?text=`+msg);
    
  });
}else{
  document.getElementById('invoiceData').innerHTML = 'Order ID नहीं मिली';
}
</script>
</body>
</html>
