<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="login.css"> <!-- CSS जुड़ेगी -->
</head>
<body>
  <div class="login-box"> <!-- CSS के लिए -->
    <h2>Login करो</h2>

    <div id="auth-box"> <!-- Login वाला box -->
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button id="loginBtn">Login</button>
    </div>

    <div id="otp-box" style="display:none;"> <!-- OTP वाला box -->
      <input type="text" id="otp" placeholder="6 Digit OTP" required>
      <button id="verifyOtpBtn">Verify OTP</button>
    </div>

    <p><a href="#" id="forgotBtn">Forget Password?</a></p>
    <p>Account नहीं है? <a href="signup.html">New Account</a></p>
    <p id="msg"></p>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
