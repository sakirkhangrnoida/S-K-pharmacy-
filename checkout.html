<!DOCTYPE html>
<html>
<head>
  <title>Checkout - GRNoida Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial;padding:15px;max-width:500px;margin:auto;background:#f3f3f3}
    input,select,textarea,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:16px}
    button{background:#ff9900;color:#fff;font-weight:bold;border:none;cursor:pointer}
    h2{text-align:center;color:#232f3e}
    .box{background:#fff;padding:20px;border-radius:8px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Delivery Details</h2>
    <input id="name" placeholder="पूरा नाम" required>
    <input id="mobile" placeholder="Mobile Number" type="tel" maxlength="10" required>
    <textarea id="address" placeholder="पूरा Address - House No, Gali, Area" rows="3" required></textarea>
    <input id="pin" placeholder="PIN Code" type="tel" maxlength="6" required>
    <select id="payment">
      <option value="COD">Cash on Delivery</option>
      <option value="Online">Online Payment</option>
    </select>
    <button onclick="placeOrder()">Place Order</button>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2EOywrcF8vJUXnsmF5PA3t3inW79UX8Y",
    authDomain: "grnoida-store.firebaseapp.com",
    databaseURL: "https://grnoida-store-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "grnoida-store",
    storageBucket: "grnoida-store.firebasestorage.app",
    messagingSenderId: "665639961400",
    appId: "1:665639961400:web:cb704b0209b910fc6a77cd"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.placeOrder = function() {
    const name = document.getElementById('name').value;
    const mobile = document.getElementById('mobile').value;
    const address = document.getElementById('address').value;
    const pin = document.getElementById('pin').value;
    const payment = document.getElementById('payment').value;
    
    if(!name || !mobile || !address || !pin){ alert('सभी Details भरो'); return; }
    if(mobile.length !== 10){ alert('10 Digit Mobile डालो'); return; }
    if(pin.length !== 6){ alert('6 Digit PIN डालो'); return; }

    const orderId = 'GR' + Date.now();
    const cart = JSON.parse(localStorage.getItem('grnoida_cart') || '[]');
    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

    set(ref(db, 'orders/' + orderId), {
      orderId: orderId,
      name: name,
      mobile: mobile,
      address: address,
      pin: pin,
      payment: payment,
      cart: cart,
      total: total,
      status: 'Order Placed',
      time: Date.now()
    }).then(() => {
      localStorage.setItem('grnoida_last_order', orderId);
      localStorage.removeItem('grnoida_cart');
      alert('Order Placed! Order ID: ' + orderId);
      window.location.href = 'settings.html';
    });
  }
</script>
</body>
</html>
