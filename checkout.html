<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Checkout - S K Pharmacy</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
body{background:#f0f2f5;font-family:Arial;margin:0}
.header{background:#232f3e;color:#fff;padding:10px;}
.box{background:#fff;padding:20px;margin:10px;border-radius:8px;max-width:600px;margin:auto;margin-top:20px}
.box input, .box textarea{width:95%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:4px;}
.box button{width:100%;padding:12px;background:#ffa41c;border:none;font-size:16px;font-weight:bold;border-radius:8px;cursor:pointer;margin-top:10px}
.summary{background:#fff;padding:15px;border:1px solid #ddd;margin-bottom:15px;border-radius:8px}
</style>
</head>
<body>
<div class="header"><h3>S K Pharmacy - Checkout</h3></div>

<div class="box">
<h3>Delivery Address</h3>
<input id="cName" placeholder="पूरा नाम" required>
<input id="cMobile" placeholder="10 अंकों का मोबाइल" required>
<textarea id="cAddress" placeholder="पूरा पता, मकान नंबर, गली" required></textarea>
<input id="cPin" placeholder="Pin Code" required>

<div class="summary">
<h4>Order Summary</h4>
<p id="pName">Product: Kesh Shine Oil</p>
<p id="pQty">Qty: 1</p>
<p id="pTotal">Total: ₹199</p>
</div>

<h3>Payment Method</h3>
<button onclick="placeOrder('COD')">Cash on Delivery</button>
<button style="background:#ff9900" onclick="placeOrder('UPI')">Pay Online UPI - ₹10 Off</button>
</div>

<script>
emailjs.init("y0q3TPXyZlaBcDeFg");
const firebaseConfig = {apiKey: "AIzaSyD2EoywecfBv8JUXnsmFS4A131in790XBW", databaseURL: "https://grnoida-store-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db = firebase.database();

// Product detail URL से लेंगे
let params = new URLSearchParams(window.location.search);
let productName = params.get('name') || "Kesh Shine Oil";
let productPrice = parseInt(params.get('price')) || 199;
let qty = parseInt(params.get('qty')) || 1;
document.getElementById('pName').innerText = "Product: " + productName;
document.getElementById('pQty').innerText = "Qty: " + qty;
document.getElementById('pTotal').innerText = "Total: ₹" + (productPrice*qty);

function placeOrder(payment){
  let cName=document.getElementById('cName'), cMobile=document.getElementById('cMobile'), cAddress=document.getElementById('cAddress'), cPin=document.getElementById('cPin');
  if(!cName.value || !cMobile.value || !cAddress.value || !cPin.value){alert('सभी डिटेल भरें'); return; }

  let orderId = "SK"+Date.now();
  let orderOTP = Math.floor(100000 + Math.random() * 900000);
  let total = payment=='UPI' ? (productPrice*qty)-10 : productPrice*qty;

  let orderData = {
    orderId: orderId, cart: [{name: productName, price: productPrice, qty: qty}],
    name: cName.value, mobile: cMobile.value, address: cAddress.value, pin: cPin.value,
    payment: payment, total: total, status: "Ordered", time: Date.now(), orderOTP: orderOTP
  };

  db.ref('orders/'+orderId).set(orderData).then(()=>{
    let msg = encodeURIComponent(`🔔 New Order\nID: ${orderId}\nProduct: ${productName}\nTotal: ₹${total}`);
    window.open(`https://wa.me/919258751739?text=`+msg);
    let otpMsg = encodeURIComponent(`S K Pharmacy\nYour Order ${orderId} OTP: ${orderOTP}\nइसे संभाल कर रखें`);
    window.open(`https://wa.me/91${cMobile.value}?text=`+otpMsg);
    alert('Order Placed! OTP आपके नंबर पर भेज दिया गया');
    window.location = `orders.html?mobile=${cMobile.value}`; // Customer के Orders पर भेज दो
  });
}
</script>
</body>
</html>
