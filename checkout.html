  <!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Checkout - S K Pharmacy</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
body{font-family:Arial;background:#f3f3f3;margin:0;padding:15px}
.box{background:#fff;padding:20px;border-radius:8px;max-width:500px;margin:auto}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
.btn{background:#FFD814;border:none;padding:12px;width:100%;font-size:16px;font-weight:bold;border-radius:8px;cursor:pointer}
h2{text-align:center}
</style>
</head>
<body>

<div class="box">
<h2>📦 Delivery Details</h2>
<input id="name" placeholder="पूरा नाम">
<input id="mobile" placeholder="10 Digit Mobile Number" maxlength="10">
<textarea id="address" placeholder="पूरा पता"></textarea>
<input id="pin" placeholder="Pincode">
<button class="btn" onclick="placeOrder()">Place Order</button>
</div>

<script>
emailjs.init("yOq3T9XyZ1aBcDeFg"); // तेरा EmailJS Key

const firebaseConfig = {apiKey: "AIzaSyD2EoywrcF8vJUXnsmF5PA3t3inW79UX8Y", databaseURL: "https://grnoida-store-default-rtdb.asia-southeast1.firebasedatabase.app"};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Cart और Total localStorage से ले लो
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let finalTotal = localStorage.getItem('total') || 0;

function placeOrder(){
  let name = document.getElementById('name').value;
  let mobile = document.getElementById('mobile').value;
  let address = document.getElementById('address').value;
  let pin = document.getElementById('pin').value;

  if(!name || !mobile || !address){ alert('सारी डिटेल भरें'); return; }

  let orderId = 'SK' + Date.now(); // Unique Order ID
  let orderOTP = Math.floor(100000 + Math.random() * 900000); // 6 digit OTP

  let orderData = {
    orderId: orderId,
    name: name,
    mobile: mobile,
    address: address,
    pin: pin,
    cart: cart,
    total: finalTotal,
    payment: 'COD',
    status: 'Ordered',
    time: Date.now(),
    orderOTP: orderOTP,
    cancelRequest: false
  };

  // 1. Firebase में Save
  db.ref('orders/' + orderId).set(orderData).then(()=>{
    
    // 2. तुझे Email
    emailjs.send("service_u1c0727", "dg8drle", {
      order_id: orderId,
      customer_name: name,
      total: finalTotal,
      mobile: mobile
    });

    // 3. तुझे WhatsApp
    window.open(`https://wa.me/919258751739?text=🚨 New Order!\nID: ${orderId}\nName: ${name}\nTotal: ₹${finalTotal}`, '_blank');

    // 4. ग्राहक को Order OTP WhatsApp
    window.open(`https://wa.me/91${mobile}?text=S K Pharmacy\nYour Order ${orderId} OTP: ${orderOTP}\nइसे संभाल कर रखें`, '_blank');

    alert('Order Placed! OTP आपके नंबर पर भेज दिया गया');
    localStorage.removeItem('cart');
    window.location.href = 'orders.html';
  });
}
</script>
</body>
</html>
