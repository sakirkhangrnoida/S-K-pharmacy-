<!DOCTYPE html>
<html lang="hi">
<head>
<title>Dashboard - S K Pharmacy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
body{font-family:'Poppins',Arial;background:#f1f5f9;margin:0;padding:20px}
.container{max-width:1300px;margin:auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
h1{color:#1e3a8a;margin:0;font-size:28px;font-weight:700}
.back-btn{padding:10px 18px;background:#6b7280;color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-family:'Poppins'}
.back-btn:hover{background:#4b5563}
.error-box{display:none;background:#fee2e2;color:#b91c1c;padding:12px 15px;border-radius:6px;margin-bottom:18px;border-left:4px solid #dc2626;font-weight:500}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px}
.stat-card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-left:5px solid #2563eb;transition:0.3s}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,0.12)}
.stat-card.green{border-left-color:#059669}
.stat-card.orange{border-left-color:#f59e0b}
.stat-card.purple{border-left-color:#8b5cf6}
.stat-icon{font-size:35px;margin-bottom:10px}
.stat-label{color:#6b7280;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.stat-value{color:#1a1a1a;font-size:32px;font-weight:700;margin:8px 0}
.stat-change{color:#059669;font-size:13px;font-weight:500}

.charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:30px}
.chart-card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.chart-card h3{color:#1e3a8a;margin:0 0 20px 0;font-size:18px}

.recent-orders{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.recent-orders h3{color:#1e3a8a;margin:0 0 20px 0;font-size:18px}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;color:#475569;padding:12px;text-align:left;font-size:13px;font-weight:600;text-transform:uppercase}
td{padding:14px;border-bottom:1px solid #f1f5f9;font-size:14px}
tr:hover{background:#f8fafc}
.status-badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.status-pending{background:#fef3c7;color:#92400e}
.status-delivered{background:#d1fae5;color:#065f46}
.loading{text-align:center;padding:50px;color:#9ca3af}

@media(max-width:968px){
.charts-grid{grid-template-columns:1fr}
</style>
</head>
<body>

<div class="container">
<div class="top-bar">
<h1>📊 S K Pharmacy Dashboard</h1>
<button class="back-btn" onclick="window.location.href='invoice.html'">← Back to Billing</button>
</div>

<div id="errorMsg" class="error-box"></div>

<!-- Stats Cards -->
<div class="stats-grid">
<div class="stat-card">
<div class="stat-icon">💰</div>
<div class="stat-label">आज की सेल</div>
<div class="stat-value" id="todaySales">₹0</div>
<div class="stat-change" id="todayChange">Loading...</div>
</div>

<div class="stat-card green">
<div class="stat-icon">🧾</div>
<div class="stat-label">आज के बिल</div>
<div class="stat-value" id="todayBills">0</div>
<div class="stat-change" id="billsChange">Loading...</div>
</div>

<div class="stat-card orange">
<div class="stat-icon">📦</div>
<div class="stat-label">कुल ऑर्डर</div>
<div class="stat-value" id="totalOrders">0</div>
<div class="stat-change">सभी समय</div>
</div>

<div class="stat-card purple">
<div class="stat-icon">👥</div>
<div class="stat-label">कुल कस्टमर</div>
<div class="stat-value" id="totalCustomers">0</div>
<div class="stat-change">Unique</div>
</div>
</div>

<!-- Charts -->
<div class="charts-grid">
<div class="chart-card">
<h3>📈 पिछले 7 दिन की सेल</h3>
<canvas id="salesChart"></canvas>
</div>
<div class="chart-card">
<h3>🎯 Status Distribution</h3>
<canvas id="statusChart"></canvas>
</div>
</div>

<!-- Recent Orders -->
<div class="recent-orders">
<h3>🕒 लेटेस्ट 10 ऑर्डर</h3>
<table>
<thead>
<tr>
<th>Bill No</th>
<th>Customer</th>
<th>Date</th>
<th>Amount</th>
<th>Status</th>
</tr>
</thead>
<tbody id="recentOrdersBody">
<tr><td colspan="5" class="loading">Loading...</td></tr>
</tbody>
</table>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAOq3f9Sahe-8KNgA9p98gGzEW4LAsh3C4",
  authDomain: "vs3-one.firebaseapp.com",
  databaseURL: "https://vs3-one-default-rtdb.firebaseio.com",
  projectId: "vs3-one",
  storageBucket: "vs3-one.appspot.com",
  messagingSenderId: "747842674908",
  appId: "1:747842674908:web:21d368653703264767ce8f"
};

let allOrders = [];
let salesChart, statusChart;

window.onload = loadDashboard;

function showError(msg){
  const err = document.getElementById('errorMsg');
  err.innerText = '⚠️ ' + msg;
  err.style.display = 'block';
  setTimeout(()=>{err.style.display='none'}, 4000);
}

function loadDashboard(){
  fetch(firebaseConfig.databaseURL + '/invoices.json')
.then(res => res.json())
.then(data => {
    allOrders = [];
    if(data){
      Object.keys(data).forEach(key => {
        let order = data[key];
        order.billNo = key;
        if(!order.status) order.status = 'pending';
        allOrders.push(order);
      });
    }
    updateStats();
    drawCharts();
    loadRecentOrders();
  })
.catch(err => {
    showError('डेटा लोड नहीं हुआ - Net चेक करो');
    document.getElementById('recentOrdersBody').innerHTML = '<tr><td colspan="5" class="loading">Error loading data</td></tr>';
  });
}

function updateStats(){
  const today = new Date().toLocaleDateString('en-IN');
  const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-IN');

  // आज की सेल
  let todaySales = allOrders.filter(o => o.billDate == today).reduce((sum,o) => sum + (o.total||0), 0);
  let yesterdaySales = allOrders.filter(o => o.billDate == yesterday).reduce((sum,o) => sum + (o.total||0), 0);

  // आज के बिल
  let todayBills = allOrders.filter(o => o.billDate == today).length;
  let yesterdayBills = allOrders.filter(o => o.billDate == yesterday).length;

  // टोटल
  let totalOrders = allOrders.length;
  let uniqueCustomers = new Set(allOrders.map(o => o.mobile)).size;

  document.getElementById('todaySales').innerText = '₹' + todaySales.toLocaleString('en-IN');
  document.getElementById('todayBills').innerText = todayBills;
  document.getElementById('totalOrders').innerText = totalOrders;
  document.getElementById('totalCustomers').innerText = uniqueCustomers;

  // Change %
  let salesChange = yesterdaySales > 0? ((todaySales - yesterdaySales)/yesterdaySales * 100).toFixed(1) : 0;
  let billsChange = yesterdayBills > 0? ((todayBills - yesterdayBills)/yesterdayBills * 100).toFixed(1) : 0;

  document.getElementById('todayChange').innerText = (salesChange >= 0? '↑ ' : '↓ ') + Math.abs(salesChange) + '% vs कल';
  document.getElementById('billsChange').innerText = (billsChange >= 0? '↑ ' : '↓ ') + Math.abs(billsChange) + '% vs कल';
}

function drawCharts(){
  // 7 Days Sales Chart
  const last7Days = [];
  const salesData = [];
  for(let i=6; i>=0; i--){
    let date = new Date(Date.now() - i*86400000).toLocaleDateString('en-IN');
    last7Days.push(date.split('/').slice(0,2).join('/'));
    let daySales = allOrders.filter(o => o.billDate == date).reduce((sum,o) => sum + (o.total||0), 0);
    salesData.push(daySales);
  }

  const ctx1 = document.getElementById('salesChart');
  if(salesChart) salesChart.destroy();
  salesChart = new Chart(ctx1, {
    type: 'line',
    data: {
      labels: last7Days,
      datasets: [{
        label: 'Sales ₹',
        data: salesData,
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37,99,235,0.1)',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      plugins: {legend: {display: false}},
      scales: {y: {beginAtZero: true}}
    }
  });

  // Status Pie Chart
  const statusCount = {
    pending: allOrders.filter(o => o.status=='pending').length,
    packed: allOrders.filter(o => o.status=='packed').length,
    shipped: allOrders.filter(o => o.status=='shipped').length,
    delivered: allOrders.filter(o => o.status=='delivered').length
  };

  const ctx2 = document.getElementById('statusChart');
  if(statusChart) statusChart.destroy();
  statusChart = new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['Pending','Packed','Shipped','Delivered'],
      datasets: [{
        data: [statusCount.pending, statusCount.packed, statusCount.shipped, statusCount.delivered],
        backgroundColor: ['#fbbf24','#60a5fa','#818cf8','#34d399']
      }]
    },
    options: {responsive: true, plugins: {legend: {position: 'bottom'}}}
  });
}

function loadRecentOrders(){
  let recent = [...allOrders].sort((a,b) => b.timestamp - a.timestamp).slice(0,10);

  if(recent.length == 0){
    document.getElementById('recentOrdersBody').innerHTML = '<tr><td colspan="5" class="loading">कोई ऑर्डर नहीं</td></tr>';
    return;
  }

  let html = '';
  recent.forEach(o => {
    html += `<tr>
      <td><b>${o.billNo}</b></td>
      <td>${o.customer}</td>
      <td>${o.billDate}</td>
      <td><b>₹${o.total}</b></td>
      <td><span class="status-badge status-${o.status}">${o.status.toUpperCase()}</span></td>
    </tr>`;
  });
  document.getElementById('recentOrdersBody').innerHTML = html;
}

// Auto refresh every 30 sec
setInterval(loadDashboard, 30000);
</script>
</body>
</html>
