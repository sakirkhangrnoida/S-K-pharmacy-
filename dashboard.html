<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - S K Pharmacy</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
body{background:#f0f2f5;font-family:Arial;margin:0}
.header{background:#232f3e;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.header button{background:#ff9900;border:none;padding:8px 15px;border-radius:4px;cursor:pointer;font-weight:bold}
.order-card{background:#fff;padding:15px;margin:15px;border-radius:8px;border-left:5px solid orange;box-shadow:0 2px 5px #ccc}
.order-card h4{margin:0 0 10px 0;color:#232f3e}
.row{display:flex;gap:20px;flex-wrap:wrap}
.col{flex:1;min-width:250px}
select, button{padding:8px 12px;margin:5px;border-radius:4px;border:1px solid #ccc;cursor:pointer}
.btn-update{background:green;color:#fff;border:none}
.btn-delete{background:red;color:#fff;border:none}
.otp{color:red;font-weight:bold;font-size:18px}
.counts{display:flex;gap:10px;margin:10px}
.count-box{background:#fff;padding:10px 20px;border-radius:8px;text-align:center;flex:1}
</style>
</head>
<body>
<div class="header">
<h3>📦 S K Pharmacy - Admin Dashboard</h3>
<div>
<button onclick="window.location='index.html'">Home</button>
<button onclick="logout()">Logout</button>
</div>
</div>

<div class="counts">
<div class="count-box"><h4 id="totalOrders">0</h4><p>Total Orders</p></div>
<div class="count-box"><h4 id="pendingOrders">0</h4><p>Pending</p></div>
<div class="count-box"><h4 id="cancelReq">0</h4><p>Cancel Request</p></div>
</div>

<div id="orderList">Loading Orders...</div>

<script>
const firebaseConfig = {apiKey: "AIzaSyD2EoywecfBv8JUXnsmFS4A131in790XBW", databaseURL: "https://grnoida-store-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db = firebase.database();

function logout(){localStorage.clear(); window.location='login.html';}

function loadAllOrders(){
  db.ref('orders').orderByChild('time').once('value').then((snapshot)=>{
    let html = ''; let total=0, pending=0, cancel=0;
    
    if(!snapshot.exists()){ document.getElementById('orderList').innerHTML = 'कोई Order नहीं है'; return; }
    
    snapshot.forEach((child)=>{
      let o = child.val(); total++;
      if(o.status=='Ordered') pending++;
      if(o.cancelRequest) cancel++;
      
      html += `<div class="order-card">
        <h4>Order ID: ${o.orderId} | Status: <b style="color:green">${o.status}</b></h4>
        <div class="row">
          <div class="col">
            <p><b>Customer:</b> ${o.name}</p>
            <p><b>Mobile:</b> ${o.mobile}</p>
            <p><b>Address:</b> ${o.address}, ${o.pin}</p>
          </div>
          <div class="col">
            <p><b>Product:</b> ${o.cart[0].name} x ${o.cart[0].qty}</p>
            <p><b>Total:</b> ₹${o.total} | <b>Payment:</b> ${o.payment}</p>
            <p class="otp">OTP: ${o.orderOTP}</p>
          </div>
          <div class="col">
            <b>Update Status:</b><br>
            <select id="status${o.orderId}">
              <option ${o.status=='Ordered'?'selected':''}>Ordered</option>
              <option ${o.status=='Shipped'?'selected':''}>Shipped</option>
              <option ${o.status=='Out for Delivery'?'selected':''}>Out for Delivery</option>
              <option ${o.status=='Delivered'?'selected':''}>Delivered</option>
              <option ${o.status=='Cancelled'?'selected':''}>Cancelled</option>
            </select><br>
            <button class="btn-update" onclick="updateStatus('${o.orderId}')">Update</button>
            <button class="btn-delete" onclick="deleteOrder('${o.orderId}')">Delete</button>
            
            ${o.cancelRequest ? `<button style="background:orange" onclick="approveCancel('${o.orderId}')">Cancel Request Approve</button>` : ''}
          </div>
        </div>
      </div>`;
    });
    
    document.getElementById('orderList').innerHTML = html;
    document.getElementById('totalOrders').innerText = total;
    document.getElementById('pendingOrders').innerText = pending;
    document.getElementById('cancelReq').innerText = cancel;
  });
}

function updateStatus(orderId){
  let newStatus = document.getElementById('status'+orderId).value;
  db.ref('orders/'+orderId).update({status: newStatus}).then(()=>{
    alert('Status Updated: ' + newStatus);
    loadAllOrders(); // Refresh
  });
}

function deleteOrder(orderId){
  if(confirm('पक्का Delete करना है?')){
    db.ref('orders/'+orderId).remove().then(()=>{alert('Delete हो गया'); loadAllOrders();});
  }
}

function approveCancel(orderId){
  db.ref('orders/'+orderId).update({status:'Cancelled', cancelRequest:false}).then(()=>{
    alert('Order Cancel कर दिया गया');
    loadAllOrders();
  });
}

// Page Load होते ही Order लोड करो
loadAllOrders();
// हर 10 सेकंड में Auto Refresh
setInterval(loadAllOrders, 10000);
</script>
