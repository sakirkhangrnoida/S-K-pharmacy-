<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Notifications - S K Pharmacy</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0}
.header{background:#232f3e;color:#fff;padding:15px;text-align:center}
.noti{background:#fff;margin:10px;padding:15px;border-radius:8px;border-left:5px solid #ff9900}
.time{font-size:12px;color:#666}
</style>
</head>
<body>

<div class="header"><h2>🔔 Notifications</h2></div>
<div id="notiList"></div>

<script type="module" src="firebase.js"></script>
<script type="module">
import { db } from './firebase.js';
import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

let userEmail = localStorage.getItem('userEmail');

onValue(ref(db, 'orders/'), (snap)=>{
  const data = snap.val();
  let html = '';
  if(data){
    Object.values(data).filter(o => o.email == userEmail).forEach(order=>{
      html += `<div class="noti">
        <p><b>Order ${order.orderId}</b> का Status: ${order.status}</p>
        <p class="time">${new Date(order.time).toLocaleString('hi-IN')}</p>
      </div>`;
    });
  }
  document.getElementById('notiList').innerHTML = html || '<p style="text-align:center;padding:50px">कोई Notification नहीं</p>';
});
</script>
</body>
</html>
